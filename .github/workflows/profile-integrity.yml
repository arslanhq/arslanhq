name: Founder profile integrity

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/check_profile.py'
      - '.github/workflows/profile-integrity.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'scripts/check_profile.py'
      - '.github/workflows/profile-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout personal profile
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check identity and public presentation
        run: python3 scripts/check_profile.py
