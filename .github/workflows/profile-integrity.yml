name: Founder profile integrity

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'scripts/check_profile.py'
      - 'scripts/test_workflow_safety.py'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  pull_request:
    paths:
      - 'README.md'
      - 'scripts/check_profile.py'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout personal profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reject unsafe workflow changes (12 offline regression cases)
        run: python3 -m unittest discover -s scripts -p 'test_workflow_safety.py' -v
      - name: Check identity and public presentation
        run: python3 scripts/check_profile.py
