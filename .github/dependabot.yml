# Monitor only dependencies used by this public profile's GitHub Actions.
# Dependabot proposes changes as pull requests; no automatic merge or deployment.
# Dependency security alerts are a separate GitHub repository setting.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Beirut"
    open-pull-requests-limit: 2
